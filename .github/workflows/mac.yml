name: macOS

on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open an SSH session to the Mac (for debugging)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Show the machine
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Find project
        id: find
        run: |
          WS=$(find . -maxdepth 3 -name '*.xcworkspace' -not -path '*/.*' | head -1)
          PROJ=$(find . -maxdepth 3 -name '*.xcodeproj' -not -path '*/.*' | head -1)
          if [ -n "$WS" ]; then
            echo "kind=workspace"        >> $GITHUB_OUTPUT
            echo "path=$WS"              >> $GITHUB_OUTPUT
          elif [ -n "$PROJ" ]; then
            echo "kind=project"          >> $GITHUB_OUTPUT
            echo "path=$PROJ"            >> $GITHUB_OUTPUT
          elif [ -f Package.swift ]; then
            echo "kind=spm"              >> $GITHUB_OUTPUT
          else
            echo "kind=none"             >> $GITHUB_OUTPUT
          fi

      - name: List schemes
        if: steps.find.outputs.kind == 'workspace' || steps.find.outputs.kind == 'project'
        run: |
          FLAG=$([ "${{ steps.find.outputs.kind }}" = "workspace" ] && echo -workspace || echo -project)
          xcodebuild -list $FLAG "${{ steps.find.outputs.path }}"

      - name: Build (Xcode)
        if: steps.find.outputs.kind == 'workspace' || steps.find.outputs.kind == 'project'
        run: |
          FLAG=$([ "${{ steps.find.outputs.kind }}" = "workspace" ] && echo -workspace || echo -project)
          SCHEME=$(xcodebuild -list $FLAG "${{ steps.find.outputs.path }}" \
                   | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "Building scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            $FLAG "${{ steps.find.outputs.path }}" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build (Swift Package)
        if: steps.find.outputs.kind == 'spm'
        run: swift build -v

      - name: Test (Swift Package)
        if: steps.find.outputs.kind == 'spm'
        run: swift test -v

      - name: Run it
        if: steps.find.outputs.kind == 'spm'
        run: swift run HelloMac

      - name: No project found
        if: steps.find.outputs.kind == 'none'
        run: |
          echo "No .xcodeproj, .xcworkspace or Package.swift in the repo yet."
          echo "Add your Xcode project, push, and this will build it automatically."

      - name: Debug over SSH
        if: ${{ inputs.debug }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
